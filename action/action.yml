name: go2xp
description: Patch and audit an experimental Go windows/386 executable for XP.
inputs:
  input:
    description: Path to the windows/386 executable with the shim linked in
    required: true
  output:
    description: Output path (default <input>-<profile>.exe)
    required: false
  profile:
    description: Target profile (xp; win7 is experimental and incomplete)
    default: xp
  go2xp-ref:
    description: Branch, tag or commit of unxed/go2xp to build
    default: main
runs:
  using: composite
  steps:
    - id: patch
      shell: bash
      env:
        GO2XP_INPUT: ${{ inputs.input }}
        GO2XP_OUTPUT: ${{ inputs.output }}
        GO2XP_PROFILE: ${{ inputs.profile }}
        GO2XP_REF: ${{ inputs.go2xp-ref }}
      run: |
        set -euo pipefail
        case "$GO2XP_PROFILE" in xp|win7) ;; *) echo 'Unknown profile' >&2; exit 1;; esac
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        git init -q "$tmp/go2xp"
        git -C "$tmp/go2xp" fetch -q --depth 1 https://github.com/unxed/go2xp "$GO2XP_REF"
        git -C "$tmp/go2xp" checkout -q --detach FETCH_HEAD
        (cd "$tmp/go2xp" && go build -o "$tmp/go2xp-bin" ./cmd/go2xp)
        out=${GO2XP_OUTPUT:-${GO2XP_INPUT%.exe}-$GO2XP_PROFILE.exe}
        prof="$tmp/go2xp/profiles/$GO2XP_PROFILE.json"
        "$tmp/go2xp-bin" patch -profile "$prof" "$GO2XP_INPUT" "$out"
        "$tmp/go2xp-bin" verify -profile "$prof" "$out"
        "$tmp/go2xp-bin" audit -profile "$prof" "$out"
        echo "patched=$out" >> "$GITHUB_OUTPUT"
outputs:
  patched:
    description: Path of the patched executable
    value: ${{ steps.patch.outputs.patched }}
